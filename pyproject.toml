[project]
name = "trial-transparency"
version = "0.1.0"
description = "Clinical trial data validation and explainability system"
requires-python = ">=3.11"
dependencies = [
    "lxml>=4.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
]

[project.scripts]
trial-transparency = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
